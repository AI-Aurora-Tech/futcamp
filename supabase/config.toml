# Configuração local do Supabase CLI para o Tabelaço.
# Ajuste "project_id" para o ref do seu projeto ao usar `supabase link`.
project_id = "tabelaco"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# URL do site para links de confirmação/redirect em desenvolvimento.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
# Em desenvolvimento é conveniente desligar a confirmação por e-mail.
enable_confirmations = false

# A validação de atleta é usada na página pública de inscrição (sem login).
[functions.validate-athlete]
verify_jwt = false

# Quem avisa do pagamento é o Mercado Pago, que não tem sessão do Supabase.
[functions.mp-webhook]
verify_jwt = false

# A cobrança confere o dono do campeonato dentro da própria função — o portão
# do Supabase rejeitaria a chamada antes disso em projetos com chave de API do
# formato novo (sb_publishable_...).
[functions.mp-checkout]
verify_jwt = false
