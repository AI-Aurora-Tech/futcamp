<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Página não encontrada — Tabelaço</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      main { max-width: 32rem; padding: 2rem 1.5rem; text-align: center; line-height: 1.6; }
      h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
      p { color: #334155; margin: 0 0 1.5rem; }
      a.btn {
        display: inline-block;
        padding: .7rem 1.4rem;
        border-radius: 8px;
        background: #16a34a;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      nav { margin-top: 1.5rem; font-size: .95rem; }
      nav a { color: #16a34a; margin: 0 .4rem; }
    </style>
  </head>
  <body>
    <!--
      Página de 404 de verdade, com status 404. Antes o `vercel.json` mandava
      QUALQUER caminho para o app, então uma URL inventada respondia 200 com a
      home — o que o Google chama de soft 404 e conta contra o site inteiro.
    -->
    <main>
      <h1>Página não encontrada</h1>
      <p>O link pode estar incorreto, ou a página foi removida.</p>
      <a class="btn" href="/">Ir para o início</a>
      <nav>
        <a href="/planos">Planos e preços</a> ·
        <a href="/como-usar">Como usar</a> ·
        <a href="/instalar">Instalar no celular</a>
      </nav>
    </main>
  </body>
</html>
